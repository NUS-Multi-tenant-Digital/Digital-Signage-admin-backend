name: CD - Push to ACR

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  IMAGE_NAME: digital-signage-repo

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Lint
        run: mvn -s .github/maven-ci-settings.xml -B checkstyle:check

      - name: Test
        run: mvn -s .github/maven-ci-settings.xml -B clean test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve image refs
        id: image
        run: |
          REF="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${REF}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${REF}:latest" >> "$GITHUB_OUTPUT"

      # Build locally first so Trivy can scan before anything is pushed to ACR.
      - name: Build image (local load)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.tag_sha }}
            ${{ steps.image.outputs.tag_latest }}

      # Prefer public.ecr.aws to avoid GHCR/GCR rate limits on trivy-db / trivy-java-db.
      - name: Trivy image scan (table)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1
        with:
          image-ref: ${{ steps.image.outputs.tag_sha }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          timeout: "10m0s"
          exit-code: "1"

      - name: Trivy image scan (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1
        with:
          image-ref: ${{ steps.image.outputs.tag_sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          vuln-type: os,library
          timeout: "10m0s"
          exit-code: "0"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: |
            trivy-report.txt
            trivy-results.sarif
          if-no-files-found: warn

      - name: Push image to ACR
        run: |
          docker push "${{ steps.image.outputs.tag_sha }}"
          docker push "${{ steps.image.outputs.tag_latest }}"
