name: SonarCloud

on:
  push:
    branches:
      - main
      - hxx
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test, coverage, and SonarCloud scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -s .github/maven-ci-settings.xml -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.6.0.6792:sonar
          -Dsonar.qualitygate.wait=false

      # Surefire + JaCoCo from mvn verify (unit/integration tests on embedded H2).
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
