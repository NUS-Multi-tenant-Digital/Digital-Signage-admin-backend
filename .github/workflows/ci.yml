name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Fast style gate so PR authors get feedback early.
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Checkstyle
        run: mvn -s .github/maven-ci-settings.xml -B checkstyle:check

  # Main validation gate: compile, unit tests, then package.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -s .github/maven-ci-settings.xml -B clean test

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

      - name: Package
        run: mvn -s .github/maven-ci-settings.xml -B package -DskipTests

  # Build container only after quality and tests are green; scan OS/library CVEs with Trivy.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t digital-signage-admin-backend:${{ github.sha }} .

      # OS packages only — avoids large trivy-java-db download failures in CI.
      # Application/Java dependency CVEs are covered by OWASP Dependency-Check (sast.yml).
      - name: Trivy image scan (table)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
        with:
          image-ref: digital-signage-admin-backend:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os
          scanners: vuln
          # Fat JAR is scanned by Dependency-Check; skipping avoids trivy-java-db download.
          skip-files: "**/*.jar"
          timeout: "10m0s"
          exit-code: "1"

      - name: Trivy image scan (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
        with:
          image-ref: digital-signage-admin-backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          vuln-type: os
          scanners: vuln
          skip-files: "**/*.jar"
          timeout: "10m0s"
          exit-code: "0"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: |
            trivy-report.txt
            trivy-results.sarif
          if-no-files-found: warn

