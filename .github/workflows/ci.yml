name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Fast style gate so PR authors get feedback early.
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Checkstyle
        run: mvn -s .github/maven-ci-settings.xml -B checkstyle:check

  # Main validation gate: compile, unit tests, then package.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -s .github/maven-ci-settings.xml -B clean test

      - name: Package
        run: mvn -s .github/maven-ci-settings.xml -B package -DskipTests

  # Build container only after quality and tests are green.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t digital-signage-admin-backend:${{ github.sha }} .
